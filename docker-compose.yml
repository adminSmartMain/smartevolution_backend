services:
  web:
    build:
      context: .
    container_name: backend_smart_evolution
    shm_size: "1gb"
    ports:
      - "${DJANGO_PORT:-8000}:${DJANGO_PORT:-8000}"
    environment:
      - DJANGO_PORT=${DJANGO_PORT:-8000}
      - XDG_RUNTIME_DIR=/tmp
      - PUPPETEER_CACHE_DIR=/root/.cache/puppeteer
    env_file:
      - docker.env
    volumes:
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: "2G"
    networks:
      - smartevolutionbackend_smartevolution_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartevolutionbackend_smartevolution_network

volumes:
  redis_data:

networks:
  smartevolutionbackend_smartevolution_network:
    external: true
    