services:
  web:
    build:
      context: .
    container_name: backend_smart_evolution_dev
    shm_size: "1gb"
    ports:
      - "${DJANGO_PORT:-8000}:${DJANGO_PORT:-8000}"
    environment:
      - DJANGO_PORT=${DJANGO_PORT:-8000}
      - XDG_RUNTIME_DIR=/tmp
      - PUPPETEER_CACHE_DIR=/root/.cache/puppeteer
    env_file:
      - docker.env
    volumes:
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: "2G"
    networks:
      - smartevolutionbackend_smartevolution_network

networks:
  smartevolutionbackend_smartevolution_network:
    external: true
