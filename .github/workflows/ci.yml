name: CI

on:
  pull_request:
  push:
    branches:
      - development
      - main

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: smartevolution_test
          MYSQL_USER: smartevolution
          MYSQL_PASSWORD: smartevolution
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEBUG: "True"
      ENGINE: django.db.backends.mysql
      DB_NAME: smartevolution_test
      DB_USER: smartevolution
      DB_PASSWORD: smartevolution
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      SECRET_KEY: ci-only-secret-key
      AWS_ACCESS_KEY_ID: ci-only-key
      AWS_SECRET_ACCESS_KEY: ci-only-secret
      AWS_STORAGE_BUCKET_NAME: ci-only-bucket
      AUCO_API_PROD_URL: "https://example.invalid"
      AUCO_USER_EMAIL: qa@invalid.local
      PRIVATE_KEY: ci-only-private-key
      PUBLIC_KEY: ci-only-public-key
      EMAIL_HOST: localhost
      EMAIL_PORT: "25"
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      CHANNEL_REDIS_URL: redis://127.0.0.1:6379/2
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Grant test-database permissions
        run: mysql --host=127.0.0.1 --port=3306 --user=root --password=root -e "GRANT ALL PRIVILEGES ON *.* TO 'smartevolution'@'%'; FLUSH PRIVILEGES;"
      - name: Check Django configuration
        run: python manage.py check
      - name: Validate development and production Compose overrides
        shell: bash
        run: |
          set -eu
          export JWT_PRIVATE_KEY_HOST_PATH=/tmp/ci-jwt-private.pem
          export JWT_PUBLIC_KEY_HOST_PATH=/tmp/ci-jwt-public.pem
          export BILLY_LOG_GROUP=ci
          # This is an ephemeral CI placeholder, not a deployment secret.
          trap 'rm -f docker.production.env' EXIT
          printf '%s\n' 'AUTH_CAPTCHA_ENABLED=False' > docker.production.env
          docker compose --env-file docker.env -f docker-compose.yml -f docker-compose.development.yml config --quiet
          docker compose --env-file docker.env -f docker-compose.yml -f docker-compose.production.yml config --quiet
      - name: Run tests
        run: pytest
      - name: Verify RS256 sessions with PEM files and CAPTCHA disabled
        shell: bash
        run: |
          set -eu
          key_dir=$(mktemp -d)
          trap 'rm -f "$key_dir/private.pem" "$key_dir/public.pem"; rmdir "$key_dir"' EXIT
          openssl genpkey -quiet -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$key_dir/private.pem"
          openssl pkey -in "$key_dir/private.pem" -pubout -out "$key_dir/public.pem"
          export DEBUG=False AUTH_SECURITY_ENVIRONMENT=production AUTH_JWT_ALGORITHM=RS256
          export AUTH_JWT_SIGNING_KEY_FILE="$key_dir/private.pem"
          export AUTH_JWT_VERIFYING_KEY_FILE="$key_dir/public.pem"
          export AUTH_CAPTCHA_ENABLED=False
          export AUTH_REDIS_URL=redis://127.0.0.1:6379/3
          export RUN_RS256_SESSION_INTEGRATION=1
          pytest apps/authentication/tests/test_jwt_file_secrets.py \
            apps/authentication/tests/test_rs256_session_integration.py \
            apps/authentication/tests.py::LoginSecurityServiceTests \
            apps/authentication/tests.py::LoginSessionSecurityTests
