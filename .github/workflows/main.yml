name: Build & Deploy Production

on:
  push:
    branches:
      - main

jobs:
  deploy_to_droplet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Deploy to Droplet
    steps:
      - name: Connect with SSH and Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST_PROD }}
          username: ${{ secrets.SSH_USERNAME_PROD }}
          key: ${{ secrets.SSH_KEY_PROD }}
          port: ${{ secrets.SSH_PORT_PROD }}
          script: |
            set -eu
            cd "${{secrets.PROD_FOLDER}}"
            test -s core/.env
            test -s docker.env
            test -s docker.production.env
            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "El repositorio contiene cambios locales rastreados; despliegue cancelado."
              exit 1
            fi
            git fetch origin main
            if ! git diff --quiet HEAD origin/main -- docker.env; then
              echo "docker.env cambia en main; revise la configuración antes del despliegue."
              exit 1
            fi
            git reset --hard origin/main
            sudo env BILLY_AWS_REGION=us-east-1 BILLY_LOG_GROUP=/smartevolution/prod/billy docker compose \
              --env-file docker.env \
              -f docker-compose.yml \
              -f docker-compose.production.yml \
              config --quiet
            sudo env BILLY_AWS_REGION=us-east-1 BILLY_LOG_GROUP=/smartevolution/prod/billy docker compose \
              --env-file docker.env \
              -f docker-compose.yml \
              -f docker-compose.production.yml \
              up --build -d
            exit
