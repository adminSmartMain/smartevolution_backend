name: Build & Deploy Production

on:
  push:
    branches:
      - main

jobs:
  deploy_to_droplet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Deploy to Droplet
    steps:
      - name: Connect with SSH and Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST_PROD }}
          username: ${{ secrets.SSH_USERNAME_PROD }}
          key: ${{ secrets.SSH_KEY_PROD }}
          port: ${{ secrets.SSH_PORT_PROD }}
          script: |
            set -eu
            cd "${{secrets.PROD_FOLDER}}"
            git fetch origin main
            script_file=$(mktemp)
            trap 'rm -f "$script_file"' EXIT
            git show origin/main:scripts/deploy_compose.sh > "$script_file"
            sh "$script_file" main docker-compose.production.yml /smartevolution/prod/billy
