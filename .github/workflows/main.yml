name: Build & Deploy Production

on:
  push:
    branches:
      - main

jobs:
  deploy_to_droplet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Deploy to Droplet
    steps:
      - name: Connect with SSH and Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST_PROD }}
          username: ${{ secrets.SSH_USERNAME_PROD }}
          key: ${{ secrets.SSH_KEY_PROD }}
          port: ${{ secrets.SSH_PORT_PROD }}
          script: |
            set -eu
            cd "${{secrets.PROD_FOLDER}}"
            git fetch origin main
            git reset --hard origin/main
            echo "${{ secrets.DOT_ENV_PROD }}" > core/.env
            test -s core/.env
            test -s docker.production.env
            sudo env BILLY_AWS_REGION=us-east-1 BILLY_LOG_GROUP=/smartevolution/prod/billy docker compose \
              --env-file docker.env \
              -f docker-compose.yml \
              -f docker-compose.production.yml \
              config --quiet
            sudo env BILLY_AWS_REGION=us-east-1 BILLY_LOG_GROUP=/smartevolution/prod/billy docker compose \
              --env-file docker.env \
              -f docker-compose.yml \
              -f docker-compose.production.yml \
              up --build -d
            exit
