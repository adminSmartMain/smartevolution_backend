name: Build & Deploy Testing

on:
  push:
    branches:
      - development

jobs:
  deploy_to_droplet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Deploy to Droplet
    steps:
      - name: Connect with SSH and Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST_TEST }}
          username: ${{ secrets.SSH_USERNAME_TEST }}
          key: ${{ secrets.SSH_KEY_TEST }}
          port: ${{ secrets.SSH_PORT_TEST }}
          script: |
            set -eu
            cd "${{secrets.TEST_FOLDER}}"
            # Fetch the reviewed preflight script without replacing the checkout.
            git fetch origin development
            script_file=$(mktemp)
            trap 'rm -f "$script_file"' EXIT
            git show origin/development:scripts/deploy_compose.sh > "$script_file"
            sh "$script_file" development docker-compose.development.yml /smartevolution/dev/billy
