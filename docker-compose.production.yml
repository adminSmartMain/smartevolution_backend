services:
  web:
    env_file: !override
      - docker.production.env
    volumes:
      - ./core/.env:/app/core/.env:ro
    entrypoint:
      - /bin/sh
      - -c
    command:
      - exec daphne -b 0.0.0.0 -p 8000 core.asgi:application
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:8000:8000"

  worker-billy:
    env_file: !override
      - docker.production.env
    volumes:
      - ./core/.env:/app/core/.env:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker-notifications:
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    env_file: !override
      - docker.production.env
    volumes:
      - ./core/.env:/app/core/.env:ro

  beat-billy:
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    env_file: !override
      - docker.production.env
    volumes:
      - ./core/.env:/app/core/.env:ro
