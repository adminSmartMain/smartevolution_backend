services:
  web:
    environment: &jwt_environment
      AUTH_JWT_SIGNING_KEY_FILE: /run/secrets/jwt-private.pem
      AUTH_JWT_VERIFYING_KEY_FILE: /run/secrets/jwt-public.pem
    secrets: &jwt_secrets
      - jwt-private.pem
      - jwt-public.pem
    env_file: !override
      - docker.production.env
    volumes:
      - ./core/.env:/app/core/.env:ro
    entrypoint:
      - /bin/sh
      - -c
    command:
      - exec daphne -b 0.0.0.0 -p 8000 core.asgi:application
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:8000:8000"

  worker-billy:
    environment: *jwt_environment
    secrets: *jwt_secrets
    env_file: !override
      - docker.production.env
    volumes:
      - ./core/.env:/app/core/.env:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker-notifications:
    environment: *jwt_environment
    secrets: *jwt_secrets
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    env_file: !override
      - docker.production.env
    volumes:
      - ./core/.env:/app/core/.env:ro

  beat-billy:
    environment: *jwt_environment
    secrets: *jwt_secrets
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    env_file: !override
      - docker.production.env
    volumes:
      - ./core/.env:/app/core/.env:ro

secrets:
  jwt-private.pem:
    file: ${JWT_PRIVATE_KEY_HOST_PATH:?Set JWT_PRIVATE_KEY_HOST_PATH in jwt-paths.env}
  jwt-public.pem:
    file: ${JWT_PUBLIC_KEY_HOST_PATH:?Set JWT_PUBLIC_KEY_HOST_PATH in jwt-paths.env}
